<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5b301" />
    <title>Offline, Chupnow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        color: #17140f;
        background:
          radial-gradient(56rem 32rem at 10% -10%, rgba(245, 179, 1, 0.32), transparent 62%),
          radial-gradient(42rem 28rem at 94% 2%, rgba(245, 158, 11, 0.2), transparent 62%),
          linear-gradient(180deg, #fdfbf6, #f6f0e4);
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 26rem;
        padding: 32px 28px;
        text-align: center;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.3);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        box-shadow: 0 20px 40px rgba(23, 20, 15, 0.14);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
        border-radius: 18px;
        background: #f5b301;
        color: #17140f;
        font-size: 26px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #574f42;
      }
      button {
        margin-top: 22px;
        padding: 13px 22px;
        width: 100%;
        font: inherit;
        font-weight: 700;
        color: #17140f;
        border: 0;
        border-radius: 999px;
        background: #f5b301;
        cursor: pointer;
      }
      button:hover {
        background: #e0a400;
      }
      .note {
        margin-top: 14px;
        font-size: 0.75rem;
        color: #7a7161;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">🍲</span>
      <h1>You are offline</h1>
      <p>
        Chupnow needs a connection to load live menus, prices and delivery status. The app
        shell is cached, so the interface will come back the moment you reconnect.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="note">
        Delivery status shown in the app is simulated in this build: the map tiles are real, the courier
        position is not.
      </p>
    </main>
  </body>
</html>
